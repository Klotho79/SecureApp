# Caddy in front of the relay (2026-09-24) — terminates HTTPS with an automatically
# obtained/renewed Let's Encrypt certificate, so the download link and the app's own
# wss:// connection work from any network without WireGuard.
#
# Deliberately a SEPARATE compose project from the relay's own: the relay keeps its
# existing 192.168.50.8:8080 binding untouched, so every already-paired device keeps
# working on ws://192.168.50.8:8080 during and after the switch. No flag day.
#
# Requires ports 80 and 443 forwarded to the Pi on the router. Port 80 is needed for the
# ACME challenge and to redirect http:// to https:// — Caddy does both by itself.
services:
  caddy:
    image: caddy:2
    container_name: secureapp-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data           # certificates — MUST persist, or every restart re-requests one
      - ./config:/config
      - ./logs:/var/log/caddy
    restart: unless-stopped
