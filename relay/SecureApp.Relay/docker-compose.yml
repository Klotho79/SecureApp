services:
  secureapp-relay:
    build:
      context: ../..
      dockerfile: relay/SecureApp.Relay/Dockerfile
    container_name: secureapp-relay
    environment:
      - SECUREAPP_RELAY_ADMIN_SECRET=${SECUREAPP_RELAY_ADMIN_SECRET}
      # New-member WireGuard onboarding (2026-09-23) — both optional, see Program.cs's own remarks:
      # this relay works fine without them, /admin/wireguard/clients just 404s until they're set.
      # Values live only in the Pi's own local .env (untracked — confirmed via `git check-ignore`/
      # `ls-files` returning nothing for it, so it was always plain-file-on-the-Pi, never committed;
      # never typed into chat either, see this pass's own history for why), never in this file.
      - SECUREAPP_WGEASY_URL=${SECUREAPP_WGEASY_URL}
      - SECUREAPP_WGEASY_PASSWORD=${SECUREAPP_WGEASY_PASSWORD}
      - SECUREAPP_RELAY_PORT=8080
      - SECUREAPP_RELAY_DB_PATH=/data/relay.db3
      - SECUREAPP_RELAY_LIBRARY_DIR=/data/library-files
      # Public download page (2026-09-10, see Program.cs's own remarks) — put built release
      # artifacts (e.g. secureapp-android.apk) directly into ./data/downloads/ on the Pi's host;
      # served live from disk, no rebuild/redeploy needed to publish a new build.
      - SECUREAPP_RELAY_DOWNLOADS_DIR=/data/downloads
    volumes:
      - ./data:/data
    ports:
      # Bind to the Pi's own LAN IP — never 0.0.0.0/a public interface. wg-easy runs in its own
      # container (its wg0 interface lives only in that container's network namespace, not on
      # the host), so a WireGuard client reaches this the same way it reaches any other LAN
      # device: via the routing wg-easy already sets up back into the home network, not via a
      # shared "10.8.0.x" address. The router only forwards WireGuard's own port (51820) to the
      # internet, so this port is never reachable from outside the LAN/VPN either way. Update
      # this IP if the Pi's wired address ever changes (check with: hostname -I).
      - "192.168.50.8:8080:8080"
    restart: unless-stopped
