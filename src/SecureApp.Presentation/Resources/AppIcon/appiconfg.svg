<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Laryngoscope, side view: knurled handle + long Macintosh blade (gentle distal curve, flange, tip bead, bulb).
     Kept inside Android's adaptive-icon safe circle (r ~139 around the centre). -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFFFF" />
            <stop offset="0.6" stop-color="#E2EBF0" />
            <stop offset="1" stop-color="#A7BCC7" />
        </linearGradient>
        <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#AFC3CD" />
            <stop offset="0.35" stop-color="#FFFFFF" />
            <stop offset="0.7" stop-color="#DCE7EC" />
            <stop offset="1" stop-color="#8FA7B3" />
        </linearGradient>
        <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8CA3AF" />
            <stop offset="0.35" stop-color="#EEF4F6" />
            <stop offset="1" stop-color="#768F9C" />
        </linearGradient>
        <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFE9A3" stop-opacity="0.8" />
            <stop offset="1" stop-color="#FFE9A3" stop-opacity="0" />
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFF6D0" stop-opacity="1" />
            <stop offset="1" stop-color="#FFD45C" stop-opacity="0" />
        </radialGradient>
        <clipPath id="grip">
            <rect x="0" y="24" width="44" height="140" />
        </clipPath>
    </defs>

    <g transform="translate(234,244) scale(0.8) translate(-118,-82)">
        <!-- Drop shadow -->
        <g fill="#062A37" opacity="0.3" transform="translate(6,8)">
            <path d="M50 -26 L112 -26 C172 -26 214 -8 238 26 C241 31 236 37 230 35 C206 10 166 0 112 0 L50 0 Z" />
            <rect x="-4" y="-30" width="58" height="34" rx="7" />
            <rect x="-2" y="0" width="48" height="194" rx="9" />
        </g>

        <!-- Light beam, shining forward/down from the bulb -->
        <path d="M176 6 L246 92 L200 108 Z" fill="url(#beam)" />

        <!-- Blade: long Macintosh blade, straight proximally, gentle distal curve, tapering -->
        <path d="M50 -26 L112 -26 C172 -26 214 -8 238 26 C241 31 236 37 230 35 C206 10 166 0 112 0 L50 0 Z"
              fill="url(#blade)" />
        <!-- Flange step (where the tall proximal flange runs out into the spatula) -->
        <path d="M54 -12 L110 -12 C140 -12 160 -9 178 -4" fill="none" stroke="#9CB2BD" stroke-width="3" stroke-linecap="round" />
        <!-- Spine highlight -->
        <path d="M56 -21 L112 -21 C168 -21 206 -5 228 22" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
        <!-- Tip bead -->
        <circle cx="235" cy="30" r="6" fill="#E9F0F3" />

        <!-- Bulb on the underside -->
        <circle cx="176" cy="6" r="18" fill="url(#glow)" />
        <circle cx="176" cy="5" r="6" fill="#FFD45C" />

        <!-- Handle -->
        <rect x="0" y="6" width="44" height="182" rx="8" fill="url(#cyl)" />
        <g clip-path="url(#grip)" stroke="#7F98A5" stroke-width="2" opacity="0.75">
            <path d="M0 0 L44 44 M0 11 L44 55 M0 22 L44 66 M0 33 L44 77 M0 44 L44 88 M0 55 L44 99 M0 66 L44 110 M0 77 L44 121 M0 88 L44 132 M0 99 L44 143 M0 110 L44 154 M0 121 L44 165 M0 132 L44 176 M0 143 L44 187 M0 154 L44 198" />
            <path d="M44 0 L0 44 M44 11 L0 55 M44 22 L0 66 M44 33 L0 77 M44 44 L0 88 M44 55 L0 99 M44 66 L0 110 M44 77 L0 121 M44 88 L0 132 M44 99 L0 143 M44 110 L0 154 M44 121 L0 165 M44 132 L0 176 M44 143 L0 187 M44 154 L0 198" />
        </g>
        <!-- Top collar and bottom screw cap -->
        <rect x="-2" y="2" width="48" height="20" rx="4" fill="url(#cap)" />
        <rect x="-2" y="166" width="48" height="26" rx="9" fill="url(#cap)" />
        <rect x="-2" y="174" width="48" height="2.5" fill="#7A929F" />
        <rect x="-2" y="181" width="48" height="2.5" fill="#7A929F" />

        <!-- Blade heel / hook-on fitting with hinge pin -->
        <rect x="-4" y="-30" width="58" height="34" rx="7" fill="url(#blade)" />
        <circle cx="16" cy="-13" r="7" fill="#14688A" />
        <circle cx="16" cy="-13" r="2.5" fill="#E8F3F7" />
    </g>
</svg>
