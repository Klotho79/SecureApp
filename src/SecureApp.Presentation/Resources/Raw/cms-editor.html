<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMS editor</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mute:#6b7280;--line:#e2e5ea;--acc:#2563eb;--soft:#eff4ff;--danger:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1f;--fg:#ececf0;--mute:#9aa0a6;--line:#3a3a40;--acc:#60a5fa;--soft:#202938;--danger:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "IBM Plex Sans","Segoe UI",system-ui,sans-serif}
#bar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
#bar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
button,select,input{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 9px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
#wrap{padding:16px 12px 160px}
#stage{margin:0 auto;max-width:760px}
#title{width:100%;font-size:26px;font-weight:700;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0;margin-bottom:12px;background:transparent}
.blk{position:relative;padding:3px 4px 3px 26px;border-radius:8px;margin:2px 0}
.blk:hover,.blk:focus-within{background:var(--soft)}
.blk>.hd{position:absolute;left:4px;top:8px;cursor:grab;color:var(--mute);user-select:none;font-size:13px}
.blk>.tools{position:absolute;right:4px;top:-12px;display:none;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 4px;z-index:5;align-items:center}
.blk:hover>.tools,.blk:focus-within>.tools{display:flex}
.tools button,.tools select,.tools input{padding:1px 6px;font-size:12px}
[contenteditable]{outline:none;min-height:1.5em}
[contenteditable]:empty:before{content:attr(data-ph);color:var(--mute)}
.h1{font-size:1.75em;font-weight:700;line-height:1.25}.h2{font-size:1.4em;font-weight:700;line-height:1.3}.h3{font-size:1.2em;font-weight:700}
ul,ol{margin:0;padding-left:1.4em}
figure{margin:0}figure img{display:block;max-width:100%;height:auto;border-radius:6px}
figcaption{font-style:italic;font-size:.85em;text-align:center;color:var(--mute)}
.imgwrap{display:flex}
.vid{position:relative;background:#111;color:#fff;border-radius:8px;overflow:hidden;width:100%}
.vid img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.vid .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;text-shadow:0 1px 4px #000}
.vid .name{position:absolute;left:8px;bottom:6px;font-size:12px;text-shadow:0 1px 4px #000;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.cell{border:1px dashed var(--line);border-radius:8px;padding:4px;min-height:56px}
#stage.compact .row{display:block}#stage.compact .cell{margin-bottom:8px}
.drop-line{height:3px;background:var(--acc);border-radius:2px;margin:2px 0;pointer-events:none}
/* Same callout rule as the reader (CmsDocumentView): a paragraph opening with CAVE/Pozor/… or Pozn./Tip. */
.blk.co-warn{background:#fbefdd;box-shadow:inset 3px 0 0 #b5730c}
.blk.co-info{background:#e1edfa;box-shadow:inset 3px 0 0 #1565c0}
@media (prefers-color-scheme:dark){.blk.co-warn{background:#3a2c10;box-shadow:inset 3px 0 0 #e5a845}.blk.co-info{background:#122a40;box-shadow:inset 3px 0 0 #64b5f6}}
#toast{display:none;position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:20;max-width:min(560px,calc(100% - 32px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;line-height:1.4;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.badge{position:fixed;right:10px;bottom:8px;font-size:12px;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
</style>
</head>
<body>
<div id="bar">
  <button data-cmd="bold" title="Tučně"><b>B</b></button>
  <button data-cmd="italic" title="Kurzíva"><i>I</i></button>
  <button data-cmd="underline" title="Podtržení"><u>U</u></button>
  <span class="sep"></span>
  <button data-add="paragraph">¶ Odstavec</button>
  <button data-add="heading">H Nadpis</button>
  <button data-add="ul">• Seznam</button>
  <button data-add="ol">1. Seznam</button>
  <button data-add="row">▥ Sloupce</button>
  <span class="sep"></span>
  <button id="restructure" title="Rozdělí slepený text na nadpisy, seznamy a odstavce (CAVE/Pozor zůstane jako zvýrazněné upozornění)">✨ Upravit strukturu</button>
  <button id="undo" hidden title="Obnoví stav před Upravit strukturu">↶ Vrátit</button>
</div>
<div id="wrap"><div id="stage"><input id="title" placeholder="Název dokumentu"><div class="drop" id="root"></div></div></div>
<div class="badge" id="badge"></div>
<div id="toast" role="status"></div>
<script id="cms-structure">
/* Smart structure (2026-11-14, user: "text je hnusny"). Pasted text used to land as ONE paragraph (plain
   insertText + runs() ignoring line boundaries), so whole documents read as a run-on wall. This turns
   text into the EXISTING block model only (heading / paragraph / list), so older app versions still read
   it. Pure functions, no editor DOM: scratch tests run them in node; only linesFromHtml needs DOMParser.
   A "line" is {runs:[{t,marks?}], hint:null|{heading:n}|{list:'ul'|'ol'}, html?:true}. */
window.cmsStructure=(function(){
'use strict';
const BULLET_RE=/^\s*(?:[•●▪◦‣⁃►▸■□○·]\s*|[-–—*]\s+|[o§]\t)/;
const ORDERED_RE=/^\s*(\d{1,2}|[a-z])[.)]\s+/;
const CUT_BULLETS='•●▪◦‣⁃►▸■';
const WARN_RE=/^\s*!*\s*(cave|pozor|upozornění|varování|nebezpečí)(?=[\s:!,.;–-]|$)/iu;
const INFO_RE=/^\s*(pozn\.?|poznámka|tip)(?=[\s:!,.;–-]|$)/iu;
const LABEL_RE=/^(\p{Lu}[^:!?;\n]{0,38}?):\s*(\S.*)$/u;
// Glued line ends in text saved before this fix ("anestetikemCo", "amputaceKI:", "FEMORALISIndikace").
// Short mixed-case terms survive by construction (SpO2, PaCO2, NaCl, mmHg, kPa, ProSeal, PEEPem);
// longer brand names that would not are listed here.
const GLUE_RES=[/(?<=\p{Ll}{3})(?=\p{Lu}\p{Ll})/gu, /(?<=\p{Ll}{3})(?=\p{Lu}{2,}[:\s])/gu, /(?<=\p{Lu}{2})(?=\p{Lu}\p{Ll}{3})/gu,
  /(?<=(?:^|[\s\d])(?:mL|ml|mg|kg|µg|μg|mcg|%))(?=\p{Lu}\p{Ll})/gu];
const GLUE_KEEP=new Set(['GlideScope','NovoSeven','ClearSight','SonoSite','PowerPoint','YouTube','WhatsApp','OneDrive','FaceTime','LinkedIn','PubMed','UpToDate','MedLine']);

const key=r=>(r.marks||[]).slice().sort().join();
function plainOf(rs){let s='';for(const r of rs||[])s+=r.t;return s;}
function sliceRuns(rs,a,b){const out=[];let pos=0;
  for(const r of rs){const s=pos,e=pos+r.t.length;pos=e;const x=Math.max(a,s),y=Math.min(b,e);
    if(y>x){const t=r.t.slice(x-s,y-s);out.push(r.marks&&r.marks.length?{t,marks:r.marks.slice()}:{t});}}
  return out;}
function trimRuns(rs){const p=plainOf(rs);const a=p.length-p.replace(/^\s+/,'').length;const b=p.replace(/\s+$/,'').length;return b>a?sliceRuns(rs,a,b):[];}
function concatRuns(...parts){const out=[];for(const part of parts)for(const r of part){if(!r.t)continue;const last=out[out.length-1];
  if(last&&key(last)===key(r))last.t+=r.t;else out.push(r.marks&&r.marks.length?{t:r.t,marks:r.marks.slice()}:{t:r.t});}return out;}
function bolded(rs){return rs.map(r=>({t:r.t,marks:[...new Set([...(r.marks||[]),'bold'])]}));}
function clean(rs){return trimRuns(concatRuns(rs.map(r=>({t:r.t.replace(/[ \t ]+/g,' ').replace(/ ?\n ?/g,'\n'),marks:r.marks}))));}
function isBold(rs){const w=rs.filter(r=>r.t.trim());return w.length>0&&w.every(r=>(r.marks||[]).includes('bold'));}
function isAllCaps(s){const l=s.replace(/[^\p{L}]/gu,'');return l.length>=4&&l===l.toUpperCase()&&l!==l.toLowerCase();}
function words(s){return s.trim().split(/\s+/).filter(Boolean).length;}
function calloutKind(s){return WARN_RE.test(s)?'warn':INFO_RE.test(s)?'info':null;}
function sentenceCase(s){const l=s.trim().toLocaleLowerCase('cs');return l.charAt(0).toLocaleUpperCase('cs')+l.slice(1);}

function linesFromPlain(text){
  return String(text||'').replace(/\r\n?/g,'\n').split('\n').map(t=>({runs:[{t:t.replace(/ /g,' ')}],hint:null}));
}

/** Splits one stored paragraph back into lines: real '\n', bullet characters, and glued line ends. */
function recoverLines(rs){
  const p=plainOf(rs), cuts=new Map();
  for(let i=0;i<p.length;i++){if(p[i]==='\n')cuts.set(i,1);else if(i>0&&CUT_BULLETS.includes(p[i])&&!cuts.has(i))cuts.set(i,0);}
  for(const re of GLUE_RES){re.lastIndex=0;let m;while((m=re.exec(p))){const i=m.index;re.lastIndex=i+1;if(cuts.has(i))continue;
    let a=i,b=i;while(a>0&&!/\s/.test(p[a-1]))a--;while(b<p.length&&!/\s/.test(p[b]))b++;
    if(GLUE_KEEP.has(p.slice(a,b).replace(/[^\p{L}]+$/u,'')))continue;cuts.set(i,0);}}
  const at=[...cuts.keys()].sort((x,y)=>x-y), lines=[];let start=0;
  for(const i of at){lines.push(sliceRuns(rs,start,i));start=i+cuts.get(i);}
  lines.push(sliceRuns(rs,start,p.length));
  return lines.map(trimRuns).filter(x=>plainOf(x).trim()).map(runs=>({runs,hint:null}));
}

/** Clipboard HTML (Word, browsers, Google Docs) to lines with heading/list hints and bold/italic/underline kept. */
function linesFromHtml(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const lines=[];let cur=null;
  const flush=()=>{if(cur&&plainOf(cur.runs).trim())lines.push(cur);cur=null;};
  const begin=hint=>{flush();cur={runs:[],hint:hint||null,html:true};};
  const push=(t,m)=>{if(!t)return;if(!cur)cur={runs:[],hint:null,html:true};const last=cur.runs[cur.runs.length-1];const k=m.slice().sort().join();
    if(last&&key(last)===k)last.t+=t;else cur.runs.push(m.length?{t,marks:m.slice()}:{t});};
  const SKIP=/^(STYLE|SCRIPT|META|TITLE|LINK|HEAD|XML|IMG|SVG|VIDEO|AUDIO|OBJECT|IFRAME|BUTTON|INPUT|SELECT|TEXTAREA|NOSCRIPT|TEMPLATE)$/;
  const BLOCK=/^(P|DIV|BLOCKQUOTE|PRE|SECTION|ARTICLE|HEADER|FOOTER|ASIDE|MAIN|NAV|DT|DD|FIGCAPTION|ADDRESS|CENTER)$/;
  function marksOf(e,m){
    const st=e.style||{},fw=String(st.fontWeight||''),tg=e.tagName.toUpperCase(),mm=m.slice();
    const add=x=>{if(!mm.includes(x))mm.push(x);},rem=x=>{const i=mm.indexOf(x);if(i>=0)mm.splice(i,1);};
    const normal=fw==='normal'||(+fw>0&&+fw<600);   // Google Docs wraps everything in <b style="font-weight:normal">
    if(((tg==='B'||tg==='STRONG')&&!normal)||fw==='bold'||fw==='bolder'||+fw>=600)add('bold');else if(normal)rem('bold');
    if(tg==='I'||tg==='EM'||st.fontStyle==='italic')add('italic');else if(st.fontStyle==='normal')rem('italic');
    if(tg==='U'||/underline/.test(st.textDecorationLine||st.textDecoration||''))add('underline');
    return mm;
  }
  function walk(n,m,inCell){
    for(const c of n.childNodes){
      if(c.nodeType===3){push(c.nodeValue.replace(/[\s ]+/g,' '),m);continue;}
      if(c.nodeType!==1)continue;
      const raw=c.tagName.toUpperCase();
      if(raw.includes(':')){walk(c,m,inCell);continue;}           // Word's <o:p> etc. are inline
      if(SKIP.test(raw))continue;
      const st=c.getAttribute('style')||'';
      if(/mso-list:\s*Ignore/i.test(st)||/display:\s*none/i.test(st))continue;   // Word's literal bullet / number
      const mm=marksOf(c,m);
      if(raw==='BR'){
        if(inCell||(cur&&cur.hint))push(' ',m);else begin(null);
        continue;
      }
      if(inCell){if(BLOCK.test(raw)||/^(LI|H[1-6]|UL|OL)$/.test(raw))push(' ',m);walk(c,mm,true);continue;}
      if(/^H[1-6]$/.test(raw)){begin({heading:Math.min(3,+raw[1])});walk(c,mm,false);flush();continue;}
      if(raw==='LI'){const ol=c.parentElement&&c.parentElement.tagName.toUpperCase()==='OL';begin({list:ol?'ol':'ul'});walk(c,mm,false);flush();continue;}
      if(raw==='UL'||raw==='OL'||raw==='TABLE'||raw==='TBODY'||raw==='THEAD'||raw==='TFOOT'){flush();walk(c,mm,false);flush();continue;}
      if(raw==='TR'){begin({list:'ul'});let first=true;
        for(const td of c.children){if(!/^T[DH]$/i.test(td.tagName))continue;if(!first)push(' – ',m);first=false;
          const tm=marksOf(td,mm);if(/^TH$/i.test(td.tagName)&&!tm.includes('bold'))tm.push('bold');walk(td,tm,true);}
        flush();continue;}
      if(BLOCK.test(raw)){
        const cls=String(c.className||'');
        if(/MsoTitle/i.test(cls))begin({heading:1});
        else if(/MsoSubtitle/i.test(cls))begin({heading:2});
        else if(/MsoListParagraph/i.test(cls)||/mso-list:\s*l\d/i.test(st)){
          const mk=c.querySelector('[style*="mso-list"]');const mt=mk?mk.textContent.replace(/[\s ]+/g,''):'';
          begin({list:/^(\d+|[a-zA-Z]|[ivxIVX]+)[.)]$/.test(mt)?'ol':'ul'});}
        else begin(null);
        walk(c,mm,false);flush();continue;
      }
      walk(c,mm,inCell);
    }
  }
  walk(doc.body||doc.documentElement,[],false);flush();
  return lines;
}

/** Lines to block models (no ids). opts.atStart: the first line opens the document, so an ALL-CAPS line there is its H1. */
function classify(lines,opts){
  opts=opts||{};
  const L=[];
  for(const ln of lines||[]){
    const rs=trimRuns(ln.runs||[]),p=plainOf(rs);if(!p.trim())continue;
    const prev=L[L.length-1];
    // A plain-text line that starts lower-case and follows an unfinished line is a wrapped continuation (PDF copy).
    if(prev&&!ln.hint&&!ln.html&&!prev.hint&&!prev.html&&/^\p{Ll}/u.test(p)&&!/[.!?:;]$/.test(plainOf(prev.runs))&&!isAllCaps(plainOf(prev.runs))&&!BULLET_RE.test(p)&&!ORDERED_RE.test(p)){
      prev.runs=concatRuns(prev.runs,[{t:' '}],rs);continue;}
    L.push({runs:rs,hint:ln.hint||null,html:!!ln.html});
  }
  const items=[];
  L.forEach((ln,idx)=>{
    const rs=ln.runs,p=plainOf(rs);let m;
    if(ln.hint&&ln.hint.heading){items.push({kind:'h',level:ln.hint.heading,runs:trimRuns(rs.length&&/:\s*$/.test(p)?sliceRuns(rs,0,p.replace(/\s*:\s*$/,'').length):rs)});return;}
    if(ln.hint&&ln.hint.list){m=p.match(BULLET_RE);items.push({kind:ln.hint.list,runs:m?trimRuns(sliceRuns(rs,m[0].length,p.length)):rs});return;}
    if((m=p.match(BULLET_RE))){items.push({kind:'ul',runs:trimRuns(sliceRuns(rs,m[0].length,p.length))});return;}
    if((m=p.match(ORDERED_RE))){items.push({kind:'ol?',marker:m[1],runs:trimRuns(sliceRuns(rs,m[0].length,p.length)),orig:rs});return;}
    if(calloutKind(p)){items.push({kind:'p',runs:rs});return;}
    if(isAllCaps(p)&&p.length<=80&&words(p)<=10){items.push({kind:'h',level:idx===0&&opts.atStart?1:2,runs:rs});return;}
    if(p.length<=60&&/:\s*$/.test(p)&&words(p)<=7&&!/[.!?]\s/.test(p)){items.push({kind:'h',level:2,runs:trimRuns(sliceRuns(rs,0,p.replace(/\s*:\s*$/,'').length))});return;}
    if(isBold(rs)&&p.length<=60&&words(p)<=8&&!/[.!?;,]$/.test(p)){items.push({kind:'h',level:2,runs:rs});return;}
    if((m=p.match(LABEL_RE))&&words(m[1])<=4){items.push({kind:'label',split:m[1].length,body:m[0].length-m[2].length,runs:rs});return;}
    items.push({kind:'p',runs:rs});
  });
  // Two or more "Label: value" lines in a row are a fact list (bold labels); a lone one with a long value opens a section.
  {const res=[];
  for(let i=0;i<items.length;){
    if(items[i].kind!=='label'){res.push(items[i]);i++;continue;}
    let j=i;while(j<items.length&&items[j].kind==='label')j++;
    const facts=j-i>=2&&items.slice(i,j).every(it=>plainOf(it.runs).length-it.body<=60);
    for(let k=i;k<j;k++){const it=items[k],len=plainOf(it.runs).length,label=trimRuns(sliceRuns(it.runs,0,it.split)),body=trimRuns(sliceRuns(it.runs,it.body,len));
      const inline=concatRuns(bolded(label),bolded([{t:':'}]),[{t:' '}],body);
      if(facts)res.push({kind:'ul',facts:true,runs:inline});
      else if(plainOf(body).length>40)res.push({kind:'h',level:2,runs:label},{kind:'p',runs:body});
      else res.push({kind:'p',runs:inline});}
    i=j;
  }
  items.splice(0,items.length,...res);}
  // Numbered lines become a numbered list only as a run of 2+ starting at 1 / a (the model cannot store another start).
  for(let i=0;i<items.length;){
    if(items[i].kind!=='ol?'){i++;continue;}
    let j=i;while(j<items.length&&items[j].kind==='ol?')j++;
    const ok=j-i>=2&&(items[i].marker==='1'||items[i].marker==='a');
    for(let k=i;k<j;k++)items[k]=ok?{kind:'ol',runs:items[k].runs}:{kind:'p',runs:items[k].orig};
    i=j;
  }
  // A short bare line right before a list ("Postup" + numbered steps) is that list's heading.
  for(let i=0;i+1<items.length;i++){const it=items[i],nx=items[i+1],p=plainOf(it.runs);
    if(it.kind==='p'&&(nx.kind==='ul'||nx.kind==='ol')&&p.length<=40&&words(p)<=4&&/^\p{Lu}/u.test(p)&&!/[.!?;,:]/.test(p)&&!calloutKind(p))items[i]={kind:'h',level:2,runs:it.runs};}
  const out=[];let lastFacts=false;
  for(const it of items){
    const text=clean(it.runs);if(!plainOf(text).trim())continue;
    if(it.kind==='h')out.push({type:'heading',level:it.level,text});
    else if(it.kind==='p')out.push({type:'paragraph',text});
    else{const ordered=it.kind==='ol',facts=!!it.facts,last=out[out.length-1];
      if(last&&last.type==='list'&&last.ordered===ordered&&lastFacts===facts)last.items.push(text);else out.push({type:'list',ordered,items:[text]});
      lastFacts=facts;}
  }
  return out;
}

return {plainOf,trimRuns,linesFromPlain,linesFromHtml,recoverLines,classify,calloutKind,sentenceCase};
})();
</script>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>'b-'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const root=$('#root'), stage=$('#stage'), previews={};
let dragged=null;
const line=document.createElement('div'); line.className='drop-line';

function el(tag,cls,html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function runsToHtml(runs){return (runs||[]).map(r=>{let h=esc(r.t||'').replace(/\n/g,'<br>');const m=r.marks||[];if(m.includes('bold'))h='<b>'+h+'</b>';if(m.includes('italic'))h='<i>'+h+'</i>';if(m.includes('underline'))h='<u>'+h+'</u>';return h;}).join('');}
function runs(rootEl){
  const out=[];
  const push=(t,m)=>{t=t.replace(/ /g,' ');if(!t)return;const last=out[out.length-1];const key=m.slice().sort().join();
    if(last&&(last.marks||[]).slice().sort().join()===key)last.t+=t;else out.push(m.length?{t,marks:m.slice()}:{t});};
  (function walk(n,m){n.childNodes.forEach(c=>{
    if(c.nodeType===3){push(c.nodeValue,m);return;}
    if(c.nodeType!==1)return;
    const tg=c.tagName;if(tg==='BR'){push('\n',m);return;}
    // A block element inside the text is a new line too (the browser wraps typed/pasted lines in DIVs);
    // dropping it is what glued "anestetikem" + "Co aplikujeme" together before 2026-11-14.
    if(/^(DIV|P|LI|H[1-6]|BLOCKQUOTE|PRE)$/.test(tg)&&out.length&&!out[out.length-1].t.endsWith('\n'))push('\n',m);
    let mm=m.slice();const st=c.style||{};
    if(tg==='B'||tg==='STRONG'||(+st.fontWeight>=600)||st.fontWeight==='bold')mm.includes('bold')||mm.push('bold');
    if(tg==='I'||tg==='EM'||st.fontStyle==='italic')mm.includes('italic')||mm.push('italic');
    if(tg==='U'||(st.textDecorationLine||st.textDecoration||'').includes('underline'))mm.includes('underline')||mm.push('underline');
    walk(c,mm);});})(rootEl,[]);
  while(out.length&&/\n$/.test(out[out.length-1].t)){const l=out[out.length-1];l.t=l.t.replace(/\n+$/,'');if(!l.t)out.pop();}   // Chromium's trailing <br>
  if(!out.length)out.push({t:''});return out;
}

/* ---------- blocks ---------- */
function shell(type,id){
  const b=el('div','blk'); b.dataset.type=type; b.dataset.id=id||uid();
  const hd=el('span','hd','⋮⋮'); hd.title='Přetáhnout';
  hd.addEventListener('mousedown',()=>{b.draggable=true;});
  b.addEventListener('dragstart',e=>{if(e.target!==b)return;dragged=b;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','blk');e.stopPropagation();});
  b.addEventListener('dragend',()=>{b.draggable=false;dragged=null;line.remove();});
  const tools=el('div','tools');
  const del=el('button',null,'✕'); del.title='Smazat blok'; del.style.color='var(--danger)';
  del.addEventListener('click',()=>{const p=b.parentElement;b.remove();ensureOne(p);});
  b._tools=tools; tools.append(del); b.append(hd,tools); return b;
}
function ensureOne(container){ if(container===root&&!$('.blk',root)) root.append(textBlock('paragraph')); }
function tbtn(b,label,title,fn){const x=el('button',null,label);x.title=title;x.addEventListener('click',fn);b._tools.insertBefore(x,b._tools.lastChild);return x;}

function textBlock(type,level,rs,id){
  const b=shell(type,id); const body=el('div','txt'+(type==='heading'?' h'+(level||1):''));
  body.contentEditable='true'; body.dataset.ph=type==='heading'?'Nadpis':'Text…'; body.innerHTML=runsToHtml(rs);
  b.dataset.level=level||1; b.append(body);
  if(type==='heading'){const sel=el('select');['1','2','3'].forEach(v=>{const o=el('option',null,'H'+v);o.value=v;sel.append(o);});sel.value=String(level||1);
    sel.addEventListener('change',()=>{b.dataset.level=sel.value;body.className='txt h'+sel.value;});b._tools.insertBefore(sel,b._tools.lastChild);}
  return b;
}
function listBlock(ordered,items,id){
  const b=shell('list',id); b.dataset.ordered=ordered?'1':'0';
  const list=el(ordered?'ol':'ul'); (items&&items.length?items:[[{t:''}]]).forEach(it=>list.append(li(it))); b.append(list);
  tbtn(b,ordered?'1.→•':'•→1.','Přepnout číslování',()=>{const o=b.dataset.ordered==='1';const n=el(o?'ul':'ol');while(list.firstChild)n.append(list.firstChild);list.replaceWith(n);b.dataset.ordered=o?'0':'1';});
  return b;
}
function li(rs){const x=el('li');x.contentEditable='true';x.dataset.ph='Položka…';x.innerHTML=runsToHtml(rs);return x;}
function imageBlock(o){
  const b=shell('image',o.id); Object.assign(b.dataset,{media:o.mediaId,aspect:o.aspectRatio||1.5,fit:o.fit||'contain',align:o.align||'center',w:o.maxWidthPct||100,alt:o.alt||''});
  const fig=el('figure'); const wrap=el('div','imgwrap'); const img=el('img'); img.draggable=false; img.src=previews[o.mediaId]||''; wrap.append(img);
  const cap=el('figcaption'); cap.contentEditable='true'; cap.dataset.ph='Popisek (volitelný)'; cap.innerHTML=runsToHtml(o.caption); fig.append(wrap,cap); b.append(fig);
  const apply=()=>{const w=+b.dataset.w;img.style.width=w+'%';wrap.style.justifyContent=b.dataset.align==='left'?'flex-start':b.dataset.align==='right'?'flex-end':'center';img.style.objectFit=b.dataset.fit;};
  const sel=(label,key,opts)=>{const s=el('select');s.title=label;opts.forEach(([v,t])=>{const o=el('option',null,t);o.value=v;s.append(o);});s.value=String(b.dataset[key]);s.addEventListener('change',()=>{b.dataset[key]=s.value;apply();});b._tools.insertBefore(s,b._tools.lastChild);};
  sel('Zarovnání','align',[['left','⟸'],['center','↔'],['right','⟹']]);
  sel('Šířka','w',[['100','100 %'],['75','75 %'],['50','50 %']]);
  sel('Přizpůsobení','fit',[['contain','celé'],['cover','oříznout']]);
  const alt=el('input'); alt.placeholder='Alt text'; alt.value=b.dataset.alt; alt.size=14; alt.addEventListener('input',()=>{b.dataset.alt=alt.value;}); b._tools.insertBefore(alt,b._tools.lastChild);
  apply(); return b;
}
function videoBlock(o){
  const b=shell('video',o.id); Object.assign(b.dataset,{media:o.mediaId,aspect:o.aspectRatio||1.7778,name:o.name||'',poster:o.posterMediaId||'',duration:o.durationSec||''});
  const v=el('div','vid'); const img=el('img'); img.draggable=false; img.src=previews[o.posterMediaId]||'';
  v.append(img,el('div','play','▶'),el('div','name',esc(o.name||'Video')));
  const set=()=>{v.style.aspectRatio=b.dataset.aspect;}; b.append(v);
  const s=el('select');[['1.7778','16:9'],['1.3333','4:3'],['2.3333','21:9'],['0.5625','9:16'],['1','1:1']].forEach(([val,t])=>{const op=el('option',null,t);op.value=val;s.append(op);});
  s.value=String(+(+b.dataset.aspect).toFixed(4)); if(s.value!==String(+(+b.dataset.aspect).toFixed(4))){const op=el('option',null,(+b.dataset.aspect).toFixed(2));op.value=b.dataset.aspect;s.append(op);s.value=b.dataset.aspect;}
  s.addEventListener('change',()=>{b.dataset.aspect=s.value;set();}); b._tools.insertBefore(s,b._tools.lastChild); set(); return b;
}
const PRESETS={'6/6':[6,6],'7/5':[7,5],'5/7':[5,7],'4/8':[4,8],'8/4':[8,4],'4/4/4':[4,4,4]};
function cell(blocks){const c=el('div','cell');const d=el('div','drop');c.append(d);wireDrop(d);(blocks&&blocks.length?blocks:[{type:'paragraph',id:uid(),text:[{t:''}]}]).forEach(m=>d.append(fromModel(m)));return c;}
function rowBlock(spans,cellsModel,id){
  const b=shell('row',id); b.dataset.spans=spans.join(','); const grid=el('div','row'); b.append(grid);
  const sel=el('select');Object.keys(PRESETS).forEach(k=>{const o=el('option',null,k);o.value=k;sel.append(o);});
  const cur=Object.keys(PRESETS).find(k=>PRESETS[k].join()===spans.join()); sel.value=cur||'6/6';
  for(let i=0;i<spans.length;i++)grid.append(cell(cellsModel&&cellsModel[i]&&cellsModel[i].blocks));
  sel.addEventListener('change',()=>{const sp=PRESETS[sel.value];b.dataset.spans=sp.join(',');
    while(grid.children.length<sp.length)grid.append(cell());
    while(grid.children.length>sp.length){const last=grid.lastChild,target=grid.children[sp.length-1];$$('.blk',last.firstChild).forEach(x=>target.firstChild.append(x));last.remove();}
    layout();});
  b._tools.insertBefore(sel,b._tools.lastChild); return b;
}
function fromModel(m){
  switch(m.type){
    case 'heading':return textBlock('heading',m.level,m.text,m.id);
    case 'paragraph':return textBlock('paragraph',0,m.text,m.id);
    case 'list':return listBlock(m.ordered,m.items,m.id);
    case 'image':return imageBlock(m);
    case 'video':return videoBlock(m);
    case 'row':return rowBlock((m.children||[]).map(c=>c.span&&c.span.expanded||6),m.children,m.id);
  } return textBlock('paragraph');
}
function toModel(b){
  const t=b.dataset.type,id=b.dataset.id;
  switch(t){
    case 'heading':return{type:t,id,level:+b.dataset.level,text:runs($('.txt',b))};
    case 'paragraph':return{type:t,id,text:runs($('.txt',b))};
    case 'list':return{type:t,id,ordered:b.dataset.ordered==='1',items:$$('li',b).map(runs)};
    case 'image':{const cap=$('figcaption',b);const cr=runs(cap);const has=cr.some(r=>r.t.trim());
      return{type:t,id,mediaId:b.dataset.media,aspectRatio:+b.dataset.aspect,fit:b.dataset.fit,align:b.dataset.align,maxWidthPct:+b.dataset.w,alt:b.dataset.alt||null,caption:has?cr:null};}
    case 'video':return{type:t,id,mediaId:b.dataset.media,aspectRatio:+b.dataset.aspect,posterMediaId:b.dataset.poster||null,durationSec:b.dataset.duration?+b.dataset.duration:null};
    case 'row':{const sp=b.dataset.spans.split(',').map(Number);const n=sp.length;
      return{type:t,id,gap:2,children:$$(':scope>.row>.cell',b).map((c,i)=>({span:{compact:12,medium:n===2?sp[i]:12,expanded:sp[i]},blocks:$$(':scope>.drop>.blk',c).map(toModel)}))};}
  }
}

/* ---------- drag & drop ---------- */
function wireDrop(c){
  c.addEventListener('dragover',e=>{
    if(!dragged)return; if(dragged.dataset.type==='row'&&c.closest('.cell'))return; if(dragged.contains(c))return;
    e.preventDefault();e.stopPropagation();
    const kids=[...c.children].filter(k=>k.classList.contains('blk')&&k!==dragged);
    let ref=null;for(const k of kids){const r=k.getBoundingClientRect();if(e.clientY<r.top+r.height/2){ref=k;break;}}
    c.insertBefore(line,ref);
  });
  c.addEventListener('drop',e=>{
    if(!dragged||!line.parentElement)return; e.preventDefault();e.stopPropagation();
    line.parentElement.insertBefore(dragged,line); line.remove(); ensureOne(root);
  });
}
wireDrop(root);

/* ---------- editing behaviour ---------- */
function focusEnd(node){node.focus();const r=document.createRange();r.selectNodeContents(node);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);}
function container(){const a=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.blk');return a;}
function insertAfter(newB){
  const cur=container();
  if(cur){const top=cur.parentElement.closest('.cell')&&newB.dataset.type==='row'?cur.closest('.row').parentElement:cur;
    (top.parentElement).insertBefore(newB,top.nextSibling);}
  else root.append(newB);
  const f=$('[contenteditable]',newB); if(f)focusEnd(f);
}
document.addEventListener('keydown',e=>{
  const t=e.target; if(!t.isContentEditable)return;
  const b=t.closest('.blk'); if(!b)return;
  if(e.key==='Enter'&&!e.shiftKey&&t.tagName!=='FIGCAPTION'){
    e.preventDefault();
    if(t.tagName==='LI'){
      if(!t.textContent.trim()&&t.parentElement.children.length>1){const p=textBlock('paragraph');b.after(p);t.remove();focusEnd($('.txt',p));return;}
      const n=li();t.after(n);focusEnd(n);return;}
    const p=textBlock('paragraph'); b.after(p); focusEnd($('.txt',p)); return;
  }
  if(e.key==='Backspace'&&!t.textContent.length){
    if(t.tagName==='LI'&&t.parentElement.children.length>1){e.preventDefault();const prev=t.previousElementSibling||t.nextElementSibling;t.remove();focusEnd(prev);return;}
    if(t.classList.contains('txt')||t.tagName==='LI'){const parent=b.parentElement;const all=$$('.blk',root).filter(x=>!x.contains(b));
      if(parent===root&&root.querySelectorAll(':scope>.blk').length<=1)return;
      e.preventDefault();const prev=b.previousElementSibling;b.remove();ensureOne(parent);const f=prev&&$('[contenteditable]:last-of-type',prev);if(f)focusEnd(f);}
  }
});
/* ---------- smart paste & "Upravit strukturu" (2026-11-14, user: "text je hnusny") ---------- */
const S=window.cmsStructure;
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>{t.style.display='none';},7000);}
function markCallouts(){$$('.blk[data-type=paragraph]',root).forEach(b=>{const k=S.calloutKind($('.txt',b).textContent);b.classList.toggle('co-warn',k==='warn');b.classList.toggle('co-info',k==='info');});}
function mergeLists(c){let prev=null;$$(':scope>.blk',c).forEach(b=>{
  if(b.dataset.type==='list'&&prev&&prev.dataset.type==='list'&&prev.dataset.ordered===b.dataset.ordered){const dst=$('ul,ol',prev);$$('li',b).forEach(x=>dst.append(x));b.remove();return;}
  prev=b;});}
/** Cuts everything after the caret out of the editable t and returns it as HTML ('' when only whitespace). */
function caretTail(t){
  const sel=getSelection();if(!sel.rangeCount)return '';
  const r=sel.getRangeAt(0);if(!t.contains(r.startContainer))return '';
  r.deleteContents();
  const tail=document.createRange();tail.setStart(r.endContainer,r.endOffset);tail.setEnd(t,t.childNodes.length);
  const box=el('div');box.append(tail.extractContents());return box.textContent.trim()?box.innerHTML:'';
}
function pasteBlocks(t,models){
  const b=t.closest('.blk');if(!b)return;
  if(t.tagName==='LI'&&models.every(m=>m.type!=='heading')){   // into a list: everything becomes items
    const items=[];models.forEach(m=>{if(m.type==='list')items.push(...m.items);else items.push(m.text);});
    let after=t;if(!t.textContent.trim())t.innerHTML=runsToHtml(items.shift());
    items.forEach(rs=>{const n=li(rs);after.after(n);after=n;});focusEnd(after);return;
  }
  const tailHtml=caretTail(t);
  let anchor=b;models.map(fromModel).forEach(n=>{anchor.after(n);anchor=n;});
  if(tailHtml){const p=textBlock('paragraph');$('.txt',p).innerHTML=tailHtml;anchor.after(p);anchor=p;}
  if(!t.textContent.trim()){if(t.tagName!=='LI')b.remove();else if(t.parentElement.children.length>1)t.remove();}
  const f=$$('[contenteditable]',anchor).pop();if(f)focusEnd(f);
  layout();markCallouts();
}
document.addEventListener('paste',e=>{
  const n=e.target&&e.target.nodeType===1?e.target:e.target&&e.target.parentElement;
  const host=n&&n.closest('.txt,li,figcaption');if(!host)return;
  e.preventDefault();
  const cd=e.clipboardData||window.clipboardData,html=cd.getData('text/html')||'',plain=cd.getData('text/plain')||'';
  if(host.tagName==='FIGCAPTION'){document.execCommand('insertText',false,plain.replace(/\s*\n\s*/g,' ').trim());return;}
  let lines=[];if(html){try{lines=S.linesFromHtml(html);}catch(err){lines=[];}}
  if(!lines.length)lines=S.linesFromPlain(plain);
  const filled=lines.filter(l=>S.plainOf(l.runs).trim());
  const b=host.closest('.blk'),empty=!host.textContent.trim();
  // insertText keeps the browser's own space handling; insertHTML only when there is formatting to keep.
  const inline=rs=>{if(rs.some(r=>r.marks&&r.marks.length))document.execCommand('insertHTML',false,runsToHtml(rs));else document.execCommand('insertText',false,S.plainOf(rs));};
  // One line into text that is already there: plain inline insert, never a surprise heading mid-sentence.
  if(filled.length<=1&&!empty){if(filled.length)inline(filled[0].runs);return;}
  const tops=$$(':scope>.blk',root);
  const models=S.classify(lines,{atStart:empty&&tops.length===1&&tops[0]===b});
  if(!models.length)return;
  if(models.length===1&&models[0].type==='paragraph'){inline(models[0].text);return;}
  if(!$('#title').value.trim()){const h=models.find(m=>m.type==='heading'&&m.level===1);if(h)$('#title').value=S.sentenceCase(S.plainOf(h.text));}
  pasteBlocks(host,models);
  toast('Vložený text je rozdělený na nadpisy, seznamy a odstavce. Zkontrolujte ho.');
});

let undoJson=null;
function snapshot(){return JSON.stringify({title:$('#title').value,blocks:$$(':scope>.blk',root).map(toModel)});}
/** Re-splits paragraphs saved before smart paste (one run-on paragraph per document) into headings / lists / paragraphs. */
function restructure(){
  const before=snapshot(),firstTop=$(':scope>.blk',root);let changed=0;
  [root,...$$('.cell>.drop',root)].forEach(c=>{
    $$(':scope>.blk[data-type=paragraph]',c).forEach(b=>{
      const rs=runs($('.txt',b)),src=S.plainOf(rs);if(!src.trim())return;
      const models=S.classify(S.recoverLines(rs),{atStart:c===root&&b===firstTop});
      if(!models.length||(models.length===1&&models[0].type==='paragraph'&&S.plainOf(models[0].text)===src))return;
      models[0].id=b.dataset.id;   // the first piece keeps the block id annotations are anchored to
      b.replaceWith(...models.map(fromModel));changed++;
    });
    mergeLists(c);
  });
  if(!changed){toast('Text už je rozdělený do nadpisů a odstavců, nebylo co upravit.');return;}
  undoJson=before;$('#undo').hidden=false;layout();markCallouts();
  toast('Hotovo, upraveno '+changed+(changed===1?' místo':changed<5?' místa':' míst')+'. Zkontrolujte výsledek, „↶ Vrátit“ obnoví původní stav.');
}
document.addEventListener('input',()=>{clearTimeout(markCallouts._t);markCallouts._t=setTimeout(markCallouts,250);
  if(undoJson){undoJson=null;$('#undo').hidden=true;}});   // after further edits a restore would throw them away

$('#bar').addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault();});
$('#bar').addEventListener('click',e=>{
  const bt=e.target.closest('button');if(!bt)return;
  if(bt.id==='restructure'){restructure();return;}
  if(bt.id==='undo'){if(undoJson){window.editor.load(undoJson);undoJson=null;bt.hidden=true;toast('Vráceno do původního stavu.');}return;}
  if(bt.dataset.cmd){document.execCommand(bt.dataset.cmd);return;}
  const a=bt.dataset.add; if(!a)return;
  insertAfter(a==='paragraph'?textBlock('paragraph'):a==='heading'?textBlock('heading',1):a==='ul'?listBlock(false):a==='ol'?listBlock(true):rowBlock([6,6]));
  layout();
});

/* ---------- responsive preview ---------- */
function layout(){
  const w=stage.clientWidth; const cls=w<600?'compact':w<=840?'medium':'expanded';
  stage.classList.remove('compact','medium','expanded'); stage.classList.add(cls);
  $$('.blk[data-type=row]',root).forEach(r=>{const sp=r.dataset.spans.split(',').map(Number);const n=sp.length;
    $$(':scope>.row>.cell',r).forEach((c,i)=>{c.style.gridColumn='span '+(cls==='expanded'?sp[i]:cls==='medium'?(n===2?sp[i]:12):12);});});
  $('#badge').textContent=Math.round(w)+' px · '+cls;
}
window.addEventListener('resize',layout);

/* ---------- API for the host ---------- */
const b64=s=>btoa(unescape(encodeURIComponent(s)));
window.editor={
  addPreview(id,url){previews[id]=url;},
  load(jsonText){
    const d=JSON.parse(jsonText); $('#title').value=d.title||''; root.innerHTML='';
    (d.blocks&&d.blocks.length?d.blocks:[{type:'paragraph',id:uid(),text:[{t:''}]}]).forEach(m=>root.append(fromModel(m)));
    layout();markCallouts();
  },
  getJson(){return b64(JSON.stringify({title:$('#title').value.trim(),blocks:$$(':scope>.blk',root).map(toModel)}));},
  insertImage(id,url,aspect){previews[id]=url;insertAfter(imageBlock({mediaId:id,aspectRatio:aspect}));layout();},
  insertVideo(id,name,aspect,posterId,posterUrl,durationSec){previews[posterId]=posterUrl;insertAfter(videoBlock({mediaId:id,aspectRatio:aspect,name,posterMediaId:posterId,durationSec}));layout();},
  setPreview(px){stage.style.maxWidth=px>0?px+'px':'760px';layout();}
};
root.append(textBlock('paragraph')); layout();
})();
</script>
